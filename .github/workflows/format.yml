name: Format source code

on:
  push:
    branches:
      - chore/readable-code-formatting

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout formatting branch
        uses: actions/checkout@v4
        with:
          ref: chore/readable-code-formatting

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Format PHP with Laravel Pint
        run: ./vendor/bin/pint

      - name: Install syntax-aware Blade formatter
        run: npm install --no-save prettier @shufo/prettier-plugin-blade

      - name: Format Blade, JavaScript and CSS
        run: |
          npx prettier --plugin=@shufo/prettier-plugin-blade --write "resources/views/**/*.blade.php"
          npx prettier --write "resources/js/**/*.js" "resources/css/**/*.css" "vite.config.js"

      - name: Commit formatter output
        run: |
          if git diff --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app bootstrap config database routes tests resources vite.config.js
          git commit -m "style: format PHP Blade and frontend source"
          git push origin chore/readable-code-formatting
